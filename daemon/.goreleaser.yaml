version: 2

project_name: anyscale

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: anyscale
    main: ./cmd/anyscalectl
    binary: anyscale
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/gabriwar/anyscale/daemon/version.shortStamp={{ .Tag }}
      - -X github.com/gabriwar/anyscale/daemon/version.longStamp={{ .Tag }}
      - -X github.com/gabriwar/anyscale/daemon/version.gitCommitStamp={{ .FullCommit }}
  - id: anyscaled
    main: ./cmd/anyscaled
    binary: anyscaled
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/gabriwar/anyscale/daemon/version.shortStamp={{ .Tag }}
      - -X github.com/gabriwar/anyscale/daemon/version.longStamp={{ .Tag }}
      - -X github.com/gabriwar/anyscale/daemon/version.gitCommitStamp={{ .FullCommit }}

archives:
  - ids: [anyscale, anyscaled]
    name_template: "anyscale_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: systemd/anyscaled.service.in
        dst: service/anyscaled.service.in
      - src: launchd/io.github.gabriwar.anyscaled.plist.in
        dst: service/io.github.gabriwar.anyscaled.plist.in

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
